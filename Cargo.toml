[workspace]
members = ["core", "ext"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

# No unwrap()/expect() outside tests: a Rust panic inside a Postgres backend is at
# best an ugly error. Crate roots re-allow these under cfg(test).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Cargo only honours [profile.*] at the workspace root, never in a member crate.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
